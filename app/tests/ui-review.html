<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UberClicker UI review — simulated</title></head><body><div id="app"></div><script type="module">
import { mockIPC } from '@tauri-apps/api/mocks';
const params = new URLSearchParams(location.search), surface=params.get('surface');
if(params.has('mobile'))Object.defineProperty(navigator,'userAgent',{value:'Mozilla/5.0 (iPhone) AppleWebKit/605.1 Mobile Safari/605.1'});
if(params.has('unsupported'))Object.defineProperty(navigator,'userAgent',{value:'Mozilla/5.0 (Macintosh) Firefox/140.0'});
const room='a'.repeat(32), token='b'.repeat(64);
const account={devices:params.has("empty")?[]:[{id:"f".repeat(32),name:"Stage clicker",channels:[room],last_seen:Date.now()-3600000},{id:"9".repeat(32),name:"Phone clicker",channels:[room],last_seen:Date.now()-120000}],user:{name:'UI Review',email:'review@example.test'},pro:true,billing:{hasCustomer:true,status:'active',until:Date.now()+86400000,trialUsed:true},rooms:params.has('empty')?[]:[{id:room,name:'Main stage',created_at:Date.now(),revoked:0,status:'active',pro_until:Date.now()+86400000,trial_used:1}]};
account.rooms.push({id:"1".repeat(32),name:"Backstage",revoked:0,status:"active",pro_until:Date.now()+86400000,trial_used:1});
let clickerLinked=params.has("paired");
let reconnectUnlinked=params.has("unlinked");
let loggedIn=!params.has('login');
window.fetch=async(path,options)=>{
 let data={};
 if(path==='/api/clickers/routes'&&params.has('routeerror'))return Response.json({error:'Could not save channels. Please retry.'},{status:503});
 if(path==='/api/clickers/routes'){for(const r of JSON.parse(options.body).routes)account.devices.find(d=>d.id===r.id).channels=r.channels;}
 else if(path==='/api/clickers/link')account.devices.push({id:'8'.repeat(32),name:'New M5',channels:[]});
 else if(path==='/v1/clickers'){const request=JSON.parse(options.body);if(request.invite)clickerLinked=true;data={v:1,room:request.id||room,token:request.token||token};}
 else if(String(path).endsWith('/clicker-link'))data={url:location.origin+location.pathname+'?mobile#send?invite='+'a'.repeat(32)+'.'+(Date.now()+600000)+'.'+'b'.repeat(64)};
 else if(String(path).endsWith('/rename')){const channel=account.rooms.find(c=>String(path).includes(c.id));channel.name=JSON.parse(options.body).name;}
 else if(String(path).endsWith('/revoke'))account.rooms.find(c=>String(path).includes(c.id)).revoked=1;
 else if(path==='/api/config')data={google:true,email:true,billing:true};
 else if(path==='/api/account'){if(!loggedIn)return Response.json({error:'Sign in'},{status:401});data=account;}
 else if(path==='/api/auth/get-session')data=loggedIn?{user:account.user}:null;
 else if(path==='/v1/rooms'){account.rooms.unshift({id:'c'.repeat(32),name:JSON.parse(options.body).name,revoked:0,status:'free',pro_until:0,trial_used:0});data={v:1,room:'c'.repeat(32),txToken:token,clientToken:'d'.repeat(64)};}
 else if(path==='/api/auth/sign-out')loggedIn=false;
 else if(path==='/api/auth/sign-in/email')loggedIn=true;
 else if(path==='/api/auth/update-user')account.user.name=JSON.parse(options.body).name;
 else if(path==='/api/billing/portal')data={url:location.origin+location.pathname+'?billing-preview'};
 else if(path==='/api/billing/checkout')throw Error('Review only: no billing action');
 return Response.json(data);
};
class FakeSocket {
 readyState=1;onmessage=null;onerror=null;onclose=null;
 constructor(){setTimeout(()=>{if(reconnectUnlinked){reconnectUnlinked=false;this.readyState=3;this.onclose?.({code:1008,reason:'Clicker unlinked'});return;}this.emit({type:'ready',account:true,session:'e'.repeat(32),now:Date.now(),receivers:clickerLinked?2:0});this.emit(clickerLinked?{type:'linked',channelCount:1}:{type:'pairing',code:'ABCD2345',expiresIn:600});},50)}
 emit(data){this.onmessage?.({data:JSON.stringify({v:1,...data})})}
 send(raw){if(raw==='ping'){this.onmessage?.({data:'pong'});return}const m=JSON.parse(raw);setTimeout(()=>{if(m.type==='sync')this.emit({type:'sync',nonce:m.nonce,now:Date.now()});else if(m.type==='click')this.emit({type:'result',id:'e'.repeat(32)+':'+m.seq,status:'submitted'});},10)}
 close(){this.readyState=3}
}
window.WebSocket=FakeSocket;
navigator.vibrate=()=>{document.body.dataset.hapticTaps=String(Number(document.body.dataset.hapticTaps||0)+1);return true;};
if(surface==='receiver'){
 window.isTauri=true;
 const mapping=(key,address)=>({keyboard:{enabled:true,key,modifiers:[]},osc:{enabled:false,host:'127.0.0.1',port:8000,address,value:1}});
 const view={settings:{proPresenter:{enabled:false,host:'127.0.0.1',port:50001,assignments:[]},outputOnStartup:true,previous:mapping('LeftArrow','/previous'),next:mapping('RightArrow','/next')},status:{connected:!params.has('empty'),armed:false,room:params.has('empty')?'':room,received:0,lastEvent:'No clicks received',error:'',relayRttMs:24,lastTransmitter:'aabbccddeeff'},api:'https://api.uberclicker.com'};
 mockIPC((cmd,args)=>{switch(cmd){case 'view':return structuredClone(view);case 'autostart_enabled':return false;case 'arm':view.status.armed=args.armed;return;case 'save_settings':view.settings=args.settings;return;case 'set_output_on_startup':view.settings.outputOnStartup=args.enabled;return;case 'set_start_on_boot':return args.enabled;case 'disconnect':view.status.connected=false;view.status.armed=false;return;case 'reconnect':case 'import_room':view.status.connected=true;view.status.room=room;return;case 'pairing':return JSON.stringify({v:1,room,token});case 'propresenter_presentations':return [{id:'test-presentation',name:'Sunday service',library:'Main library'}];default:throw Error('Review only: '+cmd)}});
}
await import('/src/main.ts');
</script></body></html>
