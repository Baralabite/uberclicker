<div id="uberclicker-device-designs">
<style>
#uberclicker-device-designs { --uc-ink:light-dark(#181818,#eeeeec);--uc-paper:light-dark(#fff,#242424);--uc-line:light-dark(#b9b9b5,#62625f);color:var(--uc-ink);font:400 14px/1.45 system-ui,sans-serif; }
#uberclicker-device-designs .uc-stage { box-sizing:border-box;min-height:650px;padding:20px 8px 30px;display:flex;flex-direction:column;align-items:center;gap:14px; }
#uberclicker-device-designs .uc-heading { width:min(100%,430px);box-sizing:border-box;padding-right:85px; }
#uberclicker-device-designs .uc-name { font-size:18px;font-weight:500; }
#uberclicker-device-designs .uc-caption { font-size:12px; }
#uberclicker-device-designs .uc-controls { display:flex;flex-wrap:wrap;gap:10px;width:min(100%,430px); }
#uberclicker-device-designs label { display:grid;gap:4px;flex:1 1 160px; }
#uberclicker-device-designs label[hidden] { display:none; }
#uberclicker-device-designs select { width:100%;min-height:44px;padding:8px;border:1px solid var(--uc-line);border-radius:6px;background:var(--uc-paper);color:var(--uc-ink);font:inherit; }
#uberclicker-device-designs canvas { width:300px;height:300px;max-width:100%;image-rendering:pixelated;background:#fff;border:1px solid var(--uc-line); }
#uberclicker-device-designs button { min-height:44px;padding:10px 18px;border:1px solid var(--uc-line);border-radius:6px;background:var(--uc-paper);color:var(--uc-ink);font:inherit; }
#uberclicker-device-designs .uc-keys { display:flex;flex-wrap:wrap;justify-content:center;gap:8px; }
#uberclicker-device-designs .uc-event { max-width:430px;min-height:40px;text-align:center;font-size:12px; }
@media(max-width:380px) { #uberclicker-device-designs canvas { width:268px;height:268px; } #uberclicker-device-designs .uc-stage { min-height:710px; } }
</style>

</div>

for(const key of Object.keys(names)){
 const stage=root.querySelector(`[data-design="${key}"]`);
 stage.innerHTML=`<div class="uc-heading"><div class="uc-name">${names[key]}</div><div class="uc-caption">${key==='quiet'?'Implemented minimal layout':'Review variation · same large TX'}</div></div><div class="uc-controls"><label>Review screen<select class="cursor-interaction" data-field="view">${Object.entries(scenes).map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select></label></div><canvas width="200" height="200" role="img"></canvas><div class="uc-caption">Actual bitmap font · 200 × 200</div><div class="uc-keys"><button class="cursor-interaction" type="button" data-key="b1">B1</button><button class="cursor-interaction" type="button" data-key="b2">B2</button><button class="cursor-interaction" type="button" data-key="both">Both</button></div><div class="uc-event" aria-live="polite"></div><div class="uc-caption">Example data · physical full refresh ≈ 2 s</div>`;
 const choices={list:['Receiver list sample',{mixed:'Fresh / offline / unknown',eight:'Eight fresh receivers',unknown:'Roster unavailable',none:'No paired receivers'}],target:['Administrator target',{right:'Stage right · aabbccdd0002',left:'Stage left · aabbccdd0003'}],remoteState:['Remote review state',{pending:'Apply pending',confirmed:'Apply confirmed',unknown:'Apply unknown',unreachable:'Receiver unreachable',cached:'Cached only',editing:'Remote edit active',rejected:'Apply rejected'}],resultState:['Receipt review state',{pending:'Lookup pending',found:'Durable receipt found',unknown:'Reply received · result unknown',unconfirmed:'Lookup reply lost',rejected:'Lookup rejected',cached:'Cached only'}],updateState:['Updater review state',{idle:'Ready to check',checking:'Checking',available:'Available · demo',current:'Current',installing:'Installing',restarting:'Restarting',failed:'Failed'}]};
 for(const [field,[label,options]]of Object.entries(choices)){const node=document.createElement('label');node.innerHTML=`${label}<select class="cursor-interaction" data-field="${field}">${Object.entries(options).map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select>`;stage.querySelector('.uc-controls').append(node);}
 stage.querySelectorAll('select').forEach(el=>el.addEventListener('change',()=>{const m=models[key];m[el.dataset.field]=el.value;if(el.dataset.field==='view'){m.rx=['rx','rxSingle','rxMultiple','managed'].includes(m.view);m.managed=m.view==='managed';m.recovery=m.view==='recovery';}m.selection=0;m.page=0;m.erase=false;m.armed=false;m.event='Review fixture selected · not a live link';draw(key);save();}));
 let timer=null,completed=false,handled=false,cancelled=false;
 function start(){const m=models[key];if(m.view!=='reset'||!m.armed||timer)return;cancelled=false;timer=setTimeout(()=>{timer=null;if(m.view!=='reset'||!m.armed)return;completed=true;m.view='claim';m.recovery=false;m.managed=false;m.rx=false;m.armed=false;m.event='Reset requested; core must confirm persistence';draw(key);save();},3000);}
 function cancel(){if(!timer)return false;clearTimeout(timer);timer=null;cancelled=true;models[key].view=home(models[key]);models[key].armed=false;models[key].event='Early release cancelled reset; no cue';draw(key);save();return true;}
 stage.querySelectorAll('[data-key]').forEach(button=>{const b=button.dataset.key;
  button.addEventListener('pointerdown',()=>{completed=false;handled=false;cancelled=false;if(b==='both')start();});
  button.addEventListener('pointerup',()=>{const stopped=cancel();handled=true;if(!completed&&!cancelled&&!stopped)gesture(key,b);});
  ['pointercancel','pointerleave','blur'].forEach(type=>button.addEventListener(type,cancel));
  button.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();if(!e.repeat){completed=false;handled=false;cancelled=false;if(b==='both')start();}}});
  button.addEventListener('keyup',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();const stopped=cancel();handled=true;if(!completed&&!cancelled&&!stopped)gesture(key,b);}});
  button.addEventListener('click',e=>{if(handled){handled=false;return;}if(e.detail===0&&!completed&&!cancelled)gesture(key,b);});
 });draw(key);
}
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);Object.keys(names).forEach(draw);}});
root.ucDesignCheck=()=>({frames:Object.keys(frames).length,logicalPixels:[200,200],allBytesValid:Object.values(frames).every(x=>atob(x).length===5000)});
})();
</script>
</div>
