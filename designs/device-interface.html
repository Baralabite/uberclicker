<div id="uberclicker-device-designs">
<style>
#uberclicker-device-designs { --uc-ink:light-dark(#181818,#eeeeec);--uc-paper:light-dark(#fff,#242424);--uc-line:light-dark(#b9b9b5,#62625f);color:var(--uc-ink);font:400 14px/1.45 system-ui,sans-serif; }
#uberclicker-device-designs .uc-stage { box-sizing:border-box;min-height:650px;padding:20px 8px 30px;display:flex;flex-direction:column;align-items:center;gap:14px; }
#uberclicker-device-designs .uc-heading { width:min(100%,430px);box-sizing:border-box;padding-right:85px; }
#uberclicker-device-designs .uc-name { font-size:18px;font-weight:500; }
#uberclicker-device-designs .uc-caption { font-size:12px; }
#uberclicker-device-designs .uc-controls { display:flex;flex-wrap:wrap;gap:10px;width:min(100%,430px); }
#uberclicker-device-designs label { display:grid;gap:4px;flex:1 1 160px; }
#uberclicker-device-designs label[hidden] { display:none; }
#uberclicker-device-designs select { width:100%;min-height:44px;padding:8px;border:1px solid var(--uc-line);border-radius:6px;background:var(--uc-paper);color:var(--uc-ink);font:inherit; }
#uberclicker-device-designs canvas { width:300px;height:300px;max-width:100%;image-rendering:pixelated;background:#fff;border:1px solid var(--uc-line); }
#uberclicker-device-designs button { min-height:44px;padding:10px 18px;border:1px solid var(--uc-line);border-radius:6px;background:var(--uc-paper);color:var(--uc-ink);font:inherit; }
#uberclicker-device-designs .uc-keys { display:flex;flex-wrap:wrap;justify-content:center;gap:8px; }
#uberclicker-device-designs .uc-event { max-width:430px;min-height:40px;text-align:center;font-size:12px; }
@media(max-width:380px) { #uberclicker-device-designs canvas { width:268px;height:268px; } #uberclicker-device-designs .uc-stage { min-height:710px; } }
</style>
<div class="viz-carousel viz-dotted-background" aria-label="Minimal transmitter review variants">

<section data-variant="Larger count" aria-label="Larger-count review layout" hidden><div class="uc-stage" data-design="split"></div></section>
</div>

function home(m){return m.recovery?'recovery':m.managed?'managed':m.rx?'rx':'home';}

function gesture(key,b){

 if(m.view==='recovery'){if(b==='both'){m.view='menu';m.selection=0;}m.event='Physical recovery only; configuration and cues stay blocked';}
