name: Firmware build and experimental release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install platformio==6.1.19
      - name: Build and test shared configuration app
        run: |
          npm ci --prefix app
          npm test --prefix app
          node scripts/build-website.mjs
      - name: Host tests and installer safety checks
        run: |
          python scripts/tests/test-package-release.py
          node --test website/flash.test.mjs scripts/tests/mirror-releases.test.mjs
          node website/check.mjs
          python firmware/tests/run_host.py
          c++ -std=c++17 -Wall -Wextra -Werror firmware/tests/config/framing.cpp -o /tmp/config-framing
          /tmp/config-framing
          python scripts/build-device-preview.py --check
      - name: Choose candidate version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os, re
          version = os.environ['REF_NAME'].removeprefix('v') if os.environ['REF_TYPE'] == 'tag' else '0.1.0-ci.' + os.environ['RUN_NUMBER']
          if len(version) > 31 or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*', version):
              raise SystemExit('Only explicit prerelease tags accepted; stable requires hardware acceptance and a reviewed promotion change')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('version=' + version + '\n')
          PY
      - name: Build and package exact flash layout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/package-release.py --version "$VERSION" --output artifacts/firmware
          node scripts/check-package.mjs artifacts/firmware
          firmware/tests/config/run.sh
          python firmware/tests/ota/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thinknode-m5-${{ steps.version.outputs.version }}
          path: artifacts/firmware/
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: thinknode-m5-${{ needs.build.outputs.version }}
          path: firmware
      - name: Publish experimental candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          cat > notes.md <<'EOF'
          Experimental ThinkNode M5 candidate. Device UI review and physical hardware acceptance remain required. No device flashing has been performed by CI. Not a stable or hardware-validated release.

          Use the browser installer at https://uberclicker.com/flash/ after the website mirror deployment completes. Select Experimental prereleases. USB programming uses CH340 serial; native USB keyboard/MIDI is unverified. Preserve mode requires an identical partition layout; full erase destroys settings and credentials.

          Opt-in OTA: after a one-time USB installation of the two-slot layout, authorize the local BLE app in physical setup and choose Open update screen with Wi-Fi configured. Use the clicker buttons to Check, review the experimental version, then Install. GitHub Pages publishes the compatible OTA feed after mirroring.

          Exact build-derived offsets, source commit, sizes and SHA-256 hashes are in manifest.json. Recovery: https://github.com/Baralabite/uberclicker/blob/main/docs/flashing.md

          UberClicker's source is MIT. The linked firmware includes GPLv3 GxEPD2 and is distributed under GPLv3 terms; firmware-source.zip and COPYING-GPL-3.txt accompany the binary assets. See THIRD_PARTY_NOTICES.md for dependency attribution.
          EOF
          gh release create "$TAG" firmware/* --verify-tag --target "$COMMIT" --prerelease --title "UberClicker $TAG (experimental)" --notes-file notes.md
