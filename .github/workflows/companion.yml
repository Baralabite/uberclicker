name: Cloud and desktop companion
on:
  workflow_dispatch:
  pull_request:
    paths: ['companion/**', 'cloud/**', 'app/**', 'contracts/**', '.github/workflows/companion.yml']
  push:
    branches: [main]
    paths: ['companion/**', 'cloud/**', 'app/**', 'contracts/**', '.github/workflows/companion.yml']
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci --prefix app && npm test --prefix app && npm run build --prefix app
      - run: npm ci && npm run check && npm test && npx wrangler deploy --dry-run
        working-directory: cloud
  desktop:
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --target universal-apple-darwin --bundles dmg
          - os: windows-latest
            args: --bundles nsis
          - os: ubuntu-24.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            companion/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - run: rustup toolchain install stable --profile minimal
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci --prefix app && npm test --prefix app
      - run: npm ci && npm run build
        working-directory: companion
      - run: cargo +stable test --locked --lib
        working-directory: companion/src-tauri
      - name: Verify native login registration and removal
        run: cargo +stable test --locked --lib autostart_registration_round_trip -- --ignored
        working-directory: companion/src-tauri
      - run: npm run tauri build -- ${{ matrix.args }} -- --locked
        working-directory: companion
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uberclicker-companion-${{ matrix.os }}
          path: |
            companion/src-tauri/target/**/bundle/dmg/*.dmg
            companion/src-tauri/target/**/bundle/nsis/*.exe
            companion/src-tauri/target/**/bundle/deb/*.deb
            companion/src-tauri/target/**/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [cloud, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: uberclicker-companion-*
          path: packages
      - name: Publish desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: companion-build-${{ github.run_id }}-${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          assets=()
          for extension in dmg exe deb AppImage; do
            matches=()
            while IFS= read -r -d '' file; do
              matches+=("$file")
            done < <(find packages -type f -name "*.$extension" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected one .$extension installer, found ${#matches[@]}" >&2
              exit 1
            fi
            assets+=("${matches[0]}")
          done
          cat > notes.md <<'EOF'
          Desktop Companion preview build. Download an installer from Assets:

          - macOS (Apple silicon and Intel): `.dmg`
          - Windows (x64): `.exe`
          - Linux (x64): `.deb` or `.AppImage`

          These installers are unsigned; macOS builds are not notarized. Your operating system may block installation or show an unverified publisher warning. On macOS, keyboard output also needs Accessibility permission. Linux needs a running Secret Service credential store.

          Setup: https://github.com/Baralabite/uberclicker/blob/main/docs/cloud.md
          EOF
          printf '\nSource commit: %s\n' "$COMMIT" >> notes.md
          gh release create "$TAG" "${assets[@]}" --target "$COMMIT" --draft --prerelease --latest=false --title "Companion preview $TAG" --notes-file notes.md
          gh release edit "$TAG" --draft=false
