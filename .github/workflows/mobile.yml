name: Mobile apps
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'contracts/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['app/**', 'contracts/**', '.github/workflows/mobile.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci && npm test && npm run build && npx cap sync android
        working-directory: app
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: app/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uberclicker-android-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm test && npm run build && npx cap sync ios
        working-directory: app
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath artifacts/ios-simulator CODE_SIGNING_ALLOWED=NO build
        working-directory: app
      - run: ditto -c -k --keepParent app/artifacts/ios-simulator/Build/Products/Debug-iphonesimulator/App.app app/artifacts/UberClicker-iOS-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uberclicker-ios-simulator
          path: app/artifacts/UberClicker-iOS-simulator.zip
          if-no-files-found: error
