[platformio]
default_envs = thinknode_m5

[env:thinknode_m5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=1
    -D UBERCLICKER_VERSION=\"0.1.0-experimental\"
    -D WEBSOCKETS_TCP_TIMEOUT=250
monitor_speed = 115200
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    jgromes/RadioLib@7.1.2
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.12.4
    adafruit/Adafruit BusIO@1.17.4
    bblanchon/ArduinoJson@7.4.2
    links2004/WebSockets@2.7.2

[env:thinknode_m5_tx]
extends = env:thinknode_m5
build_flags =
    ${env:thinknode_m5.build_flags}
    -D UBERCLICKER_ROLE_TX

[env:thinknode_m5_rx]
extends = env:thinknode_m5
build_flags =
    ${env:thinknode_m5.build_flags}
    -D UBERCLICKER_ROLE_RX
